kind = "web"
previewPath = "/"
title = "こどもの こえずかん"
description = "声で集める 世界にひとつのたからもの図鑑。大好きなもの、とっておきのもの。見つけたものを声といっしょにキロクしよう。"
version = "1.0.0"
id = "artifacts/kids-voice-encyclopedia"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21965

[services.development]
run = "pnpm --filter @workspace/kids-voice-encyclopedia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kids-voice-encyclopedia", "run", "build" ]
serve = "static"
publicDir = "artifacts/kids-voice-encyclopedia/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21965"
BASE_PATH = "/"
